[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "shandu"
version = "3.0.9"
description = "Multi-agent research system powered by Blackgeorge"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Dusan Jolovic", email = "jolovic@pm.me"}
]
keywords = ["research", "ai", "blackgeorge", "deepresearch", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "blackgeorge==1.3.0",
  "click>=8.1.7",
  "rich>=14.0.0",
  "gradio>=6.0.0",
  "aiohttp>=3.10.0",
  "beautifulsoup4>=4.12.0",
  "chardet>=5.2,<6",
  "lxml>=5.3.0",
  "ddgs>=9.0.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "trafilatura>=2.0.0",
  "readability-lxml>=0.8.4.1",
  "pymupdf>=1.27.0",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/jolovicdev/shandu"
Repository = "https://github.com/jolovicdev/shandu"
Issues = "https://github.com/jolovicdev/shandu/issues"

[project.scripts]
shandu = "shandu.cli:cli"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "mypy>=1.11.0"
]

[tool.hatch.build.targets.wheel]
packages = ["shandu"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "mypy>=1.11.0"
]
